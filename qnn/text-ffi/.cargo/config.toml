# No target-cpu here, unlike xn-ptts's own config: the Android and Linux libraries must run on
# any arm64 device, so they are built for each target's baseline. Only the SONAME is added, so
# the loader and the NDK record the library by name rather than by build path.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-soname,libptts_text.so"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-soname,libptts_text.so"]
