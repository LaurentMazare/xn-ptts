# PTTS_CONFIG=owner/model PTTS_LANG=en docker compose -f ptts-openai-server/compose.hub.yaml up
services:
  ptts-openai-server:
    image: "${PTTS_IMAGE:-ghcr.io/gradium-ai/ptts-openai-server:latest}"
    ports:
      - "8880:8880"
    environment:
      PTTS_CONFIG: "${PTTS_CONFIG:?Set PTTS_CONFIG to a Hugging Face model repo}"
      PTTS_REVISION: "${PTTS_REVISION:-main}"
      PTTS_LANG: "${PTTS_LANG:?Set PTTS_LANG to a supported normalization language}"
      PTTS_QUANT: q8
      # Pass through authentication only when it is set on the host.
      HF_TOKEN:
      HF_HOME: /home/phonon/.cache/huggingface
    volumes:
      - model-cache:/home/phonon/.cache/huggingface
    restart: unless-stopped

volumes:
  model-cache:
