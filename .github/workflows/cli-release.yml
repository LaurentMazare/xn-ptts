name: Native packages

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'ptts/**'
      - 'ptts-ffi/**'
      - 'ptts-coreml/**'
      - 'ios/**'
      - 'scripts/package-swift.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE-*'
      - 'scripts/package-cli.py'
      - 'scripts/homebrew-cli.py'
      - 'scripts/upload-release.py'
      - 'docs/cli.md'
      - 'docs/releasing.md'
      - '.github/workflows/cli-release.yml'
      - '.github/actions/setup-rust/**'
  pull_request:
    paths:
      - 'ptts/**'
      - 'ptts-ffi/**'
      - 'ptts-coreml/**'
      - 'ios/**'
      - 'scripts/package-swift.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE-*'
      - 'scripts/package-cli.py'
      - 'scripts/homebrew-cli.py'
      - 'scripts/upload-release.py'
      - 'docs/cli.md'
      - 'docs/releasing.md'
      - '.github/workflows/cli-release.yml'
      - '.github/actions/setup-rust/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: CLI / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            rustflags: '-C target-cpu=x86-64-v3'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            rustflags: '-C target-cpu=generic'
          - target: aarch64-apple-darwin
            runner: macos-15
            rustflags: '-C target-cpu=apple-m1'
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            rustflags: '-C target-cpu=x86-64-v3'
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            rustflags: '-C target-cpu=x86-64-v3 -C target-feature=+crt-static'
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # macOS 15 is the oldest Mac runner used to verify these downloads.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: cli-${{ matrix.target }}
          audio-deps: 'false'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # setup-rust removes target-cpu=native. These CPU binaries use fixed baselines,
      # with no GPU SDKs or server audio libraries needed at runtime.
      - name: Build the command
        run: cargo build --release --locked -p ptts --features cli --bin ptts --target ${{ matrix.target }}
      - name: Package and check the installed command
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/ptts"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          tag_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag_args=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/package-cli.py --binary "$binary" --target "$TARGET" ${tag_args[@]+"${tag_args[@]}"}
          mkdir unpacked
          if [ "$RUNNER_OS" = Windows ]; then
            python -m zipfile -e dist/*.zip unpacked
            installed=$(find unpacked -name ptts.exe -type f)
          else
            tar xzf dist/*.tar.gz -C unpacked
            installed=$(find unpacked -name ptts -type f)
          fi
          "$installed" --version
          "$installed" --help
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  swift:
    name: Swift release package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim
          cache-key: swift-release
          audio-deps: 'false'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the framework and wrapper
        run: |
          ./ios/build-xcframework.sh
          swift build --package-path ios/PhononTTS
      - name: Package the release
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag_args=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/package-swift.py --framework ios/PhononTTS/PhononCore.xcframework.zip ${tag_args[@]+"${tag_args[@]}"}
          unzip -q dist/ptts-swift-*.zip -d unpacked
          package=$(find unpacked -name Package.swift -type f)
          swift package --package-path "$(dirname "$package")" dump-package
          (cd dist && shasum -a 256 -c SHA256SUMS-apple)
          # Check the packaged wrapper against the exact staged framework. The public
          # URL can only be checked after publication; the release zip stays unchanged.
          package_dir=$(dirname "$package")
          unzip -q dist/PhononCore.xcframework.zip -d "$package_dir"
          python - "$package" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          start = text.index('        .binaryTarget(')
          end = text.index('\n        .target(', start)
          text = text[:start] + '        .binaryTarget(name: "PhononCore", path: "PhononCore.xcframework"),' + text[end:]
          path.write_text(text)
          PY
          swift build --package-path "$package_dir"
      - uses: actions/upload-artifact@v7
        with:
          name: swift-package
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach native packages
    needs: [build, swift]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: '{cli-*,swift-package}'
          merge-multiple: true
          path: dist
      - name: Attach archives and checksums
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat ./*.sha256 SHA256SUMS-apple > SHA256SUMS
          sha256sum --check SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes 'Release artifacts are being prepared. Review the release notes before publishing.'
          fi
          python ../scripts/homebrew-cli.py .
          python ../scripts/upload-release.py "$TAG" ./*.tar.gz ./*.zip SHA256SUMS ptts.rb
